# Umbrales de clasificación y calidad (§14.1, §14.2, §5.5). Todos parametrizables.
loadability:            # Cargabilidad = S_max_diversificada / S_capacidad_puesto (§14.1)
  overloaded_critical: 1.20
  overloaded: 1.00
  high_load: 0.80
  adequate: 0.30
  underutilized: 0.15
  # < underutilized => muy subutilizado

imbalance:
  warn_pct: 10.0         # %Desbalance de corriente (§14.2)

bank:
  open_delta_factor: 1.7320508075688772   # sqrt(3), capacidad V-V = 86.6% de 2S
  unequal_kva_ratio_flag: 1.5             # P05: kVA muy dispares sin config que lo justifique

balance:
  residual_tolerance_pct: 0.5   # criterio de aceptación §22.3
  pnt_negative_alert: true      # §13 PNT<0 es error inequívoco
  # Rangos de plausibilidad para el CIERRE del balance. La PNT se define por
  # diferencia (identidad contable), por lo que el "cierre" debe verificarse con
  # coherencia física independiente, no con la identidad misma.
  total_losses_max_pct: 40.0    # pérdidas totales por encima de esto = implausible
  technical_max_pct: 15.0       # pérdidas técnicas por encima de esto = implausible
  technical_min_pct: 1.0        # por debajo de esto = modelo técnico subestimado

# Umbrales de mecanismos de minería de etiquetas (§15.2) — placeholders calibrables (F7)
label_mining:
  drop_recovery_pct: 0.40
  drop_recovery_months: 3
  jump_after_intervention_pct: 0.30
  zero_active_months: 4

# Explicabilidad (SHAP): nº de casos de la cabeza del ranking a explicar (§17.2)
explain:
  top_n: 1000

# Punto de carga (PuntoCarga de CNEL): coherencia de acometida y dispersión (§5.3)
load_point:
  drop_overload_ratio: 1.0        # S_max/capacidad de acometida por encima => sobrecargada
  drop_underuse_ratio: 0.10       # muy por debajo => acometida sobredimensionada o consumo anómalo
  intra_dispersion_min_ratio: 0.40  # conexión por debajo de este % de la mediana del punto

# Monte Carlo de incertidumbre de pérdidas (§12): P10/P50/P90
montecarlo:
  n_samples: 500
  sigma_technical: 0.12     # incertidumbre relativa de las pérdidas técnicas (P0/Pk/carga)
  seed: 20260803
