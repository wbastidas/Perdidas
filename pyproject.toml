[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lossan"
version = "0.1.0"
description = "Plataforma de análisis de pérdidas técnicas y no técnicas en redes de distribución (F0 + dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Perdidas" }]

dependencies = [
    "duckdb>=0.10",
    "pyarrow>=14",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.5",
    "typer>=0.9",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "rustworkx>=0.13",       # F2 topología (obligatorio por desempeño)
    "networkx>=3.0",         # interfaz de conveniencia
    "scikit-learn>=1.3",     # F7 base ML e isotónica
    "ruptures>=1.1",         # F7 change points (M5)
    "openpyxl>=3.1",         # plantillas de datos Excel
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "hypothesis>=6.90", "pytest-cov>=4.1"]
examples = ["matplotlib>=3.7", "jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0"]
reports = ["jinja2>=3.1", "matplotlib>=3.7", "weasyprint>=60"]   # §18 reportes PDF
orchestration = ["dagster>=1.5", "dagster-webserver>=1.5"]        # §2.3 Dagster
# Aceleradores opcionales (el código degrada con elegancia si faltan):
power = ["OpenDSSDirect.py", "pandapower"]      # F4 validación cruzada
ml = ["lightgbm", "xgboost", "pyod", "shap", "imbalanced-learn"]  # F7 mejores modelos + SHAP
geo = ["geopandas", "shapely", "pyogrio", "pyproj"]
opt = ["ortools"]               # F8 optimización de campaña

[project.scripts]
lossan = "lossan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lossan"]
